name: Format public graduates academic-year grouping

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  format-public-graduates:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Restore Blade indentation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("resources/views/public/yearbook/graduates.blade.php")
          text = path.read_text(encoding="utf-8")

          pattern = re.compile(
              r"\n\s*/\*\n\s*\* Keep every graduate equal\.\n\s*\*\n\s*\* Graduates belong to an academic year directly\.\n\s*\* Ceremony attendance is optional, so ceremony dates\n\s*\* must not determine the yearbook grouping\.\n\s*\*/\n\s*\$groupedGraduates = \$graduates\n\s*->getCollection\(\)\n\s*->groupBy\(function \(\$graduate\) \{\n\s*\n\s*return \$graduate->academicYear\?->title\n\s*\?\? 'Academic Year';\n\s*\n\s*\}\);",
              re.DOTALL,
          )

          replacement = """
        /*
        * Keep every graduate equal.
        *
        * Graduates belong to an academic year directly.
        * Ceremony attendance is optional, so ceremony dates
        * must not determine the yearbook grouping.
        */

        $groupedGraduates = $graduates
        ->getCollection()
        ->groupBy(function ($graduate) {

        return $graduate->academicYear?->title
            ?? 'Academic Year';

        });"""

          updated, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit("Expected unformatted academic-year grouping block was not found.")

          path.write_text(updated, encoding="utf-8")
          print("Restored Blade indentation.")
          PY

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resources/views/public/yearbook/graduates.blade.php
          git rm .github/workflows/format-public-graduates-academic-year.yml
          git commit -m "Format academic-year grouping cleanly"
          git push
