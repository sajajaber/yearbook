name: Format public graduates academic-year grouping

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  format-public-graduates:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Restore Blade indentation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("resources/views/public/yearbook/graduates.blade.php")
          lines = path.read_text(encoding="utf-8").splitlines(keepends=True)

          start = next(
              (i for i, line in enumerate(lines)
               if line.strip() == "/*" and i + 1 < len(lines)
               and "Keep every graduate equal" in lines[i + 1]),
              None,
          )

          if start is None:
              raise SystemExit("Academic-year grouping start was not found.")

          end = next(
              (i for i in range(start, len(lines))
               if lines[i].strip() == "});"),
              None,
          )

          if end is None:
              raise SystemExit("Academic-year grouping end was not found.")

          block = [
              "        /*\n",
              "        * Keep every graduate equal.\n",
              "        *\n",
              "        * Graduates belong to an academic year directly.\n",
              "        * Ceremony attendance is optional, so ceremony dates\n",
              "        * must not determine the yearbook grouping.\n",
              "        */\n",
              "\n",
              "        $groupedGraduates = $graduates\n",
              "        ->getCollection()\n",
              "        ->groupBy(function ($graduate) {\n",
              "\n",
              "        return $graduate->academicYear?->title\n",
              "            ?? 'Academic Year';\n",
              "\n",
              "        });\n",
          ]

          lines[start:end + 1] = block
          path.write_text("".join(lines), encoding="utf-8")
          print("Restored Blade indentation.")
          PY

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resources/views/public/yearbook/graduates.blade.php
          git rm .github/workflows/format-public-graduates-academic-year.yml
          git commit -m "Format academic-year grouping cleanly"
          git push
