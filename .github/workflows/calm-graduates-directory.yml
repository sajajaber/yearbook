name: Update graduates directory

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update files
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          view_path = Path('resources/views/public/yearbook/graduates.blade.php')
          view = view_path.read_text(encoding='utf-8')

          if 'graduates-degree-switcher' in view:
              view, removed = re.subn(
                  r'\s*<nav class="graduates-degree-switcher" aria-label="Graduate level">.*?</nav>\s*',
                  '\n', view, count=1, flags=re.S
              )
              if removed != 1:
                  raise SystemExit('Degree switcher markup not found.')

          calm_css = r'''
    /* =========================================================
       CALM EDITORIAL FINISH
       ========================================================= */
    .graduates-page {
        --g-gold: #d8ad52;
        --g-paper: #f8fafc;
        --g-line: #e2e8f0;
        --g-muted: #718096;
    }

    .graduates-hero {
        background:
            radial-gradient(circle at 88% 15%, rgba(216,173,82,.10), transparent 24%),
            linear-gradient(135deg, #f8fafc 0%, #ffffff 58%, #f1f6fb 100%);
    }

    .graduates-hero h1 { letter-spacing: -2.8px; }
    .graduates-discovery { margin-bottom: 54px; }

    .graduates-filter-shell {
        border-color: rgba(0,42,92,.08);
        border-radius: 20px;
        background: rgba(255,255,255,.96);
        box-shadow: 0 12px 34px rgba(15,23,42,.055);
    }

    .graduates-filter-field input,
    .graduates-filter-field select {
        background: #f8fafc;
        border-color: #eef2f7;
    }

    .graduates-filter-field input:hover,
    .graduates-filter-field select:hover,
    .graduates-filter-field input:focus,
    .graduates-filter-field select:focus {
        border-color: rgba(0,42,92,.12);
        box-shadow: 0 0 0 3px rgba(216,173,82,.08);
    }

    .graduates-filter-button { background: #173d67; box-shadow: none; }
    .graduates-filter-button:hover {
        background: #d8ad52;
        box-shadow: 0 8px 20px rgba(23,61,103,.10);
    }

    .graduates-archive-header { margin-bottom: 26px; }

    .graduates-year-number {
        background: #edf3f8;
        color: var(--g-ink);
        border: 1px solid #dce6ef;
    }

    .graduate-card {
        border-color: #e3e9f0;
        border-radius: 20px;
        box-shadow: 0 6px 22px rgba(15,23,42,.035);
    }

    .graduate-link:hover .graduate-card {
        transform: translateY(-5px);
        border-color: rgba(216,173,82,.38);
        box-shadow: 0 18px 38px rgba(15,23,42,.075);
    }

    .graduate-portrait { background: linear-gradient(145deg, #173d67, #315f88); }
    .graduate-card-body { padding: 20px 20px 21px; }
    .graduate-name { letter-spacing: -.2px; }

    .graduates-empty {
        border-color: #dfe7ef;
        background: rgba(255,255,255,.82);
        box-shadow: 0 8px 28px rgba(15,23,42,.035);
    }
'''

          if 'CALM EDITORIAL FINISH' not in view:
              view = view.replace('</style>', calm_css + '\n</style>', 1)
          view_path.write_text(view, encoding='utf-8')

          controller_path = Path('app/Http/Controllers/PublicYearbookController.php')
          controller = controller_path.read_text(encoding='utf-8')
          old = "        $year = $request->input('year');\n        $degree = $request->input('degree');"
          new = "        $activeAcademicYear = AcademicYear::where('status', 'active')->latest()->first();\n        $year = $request->has('year') ? $request->input('year') : $activeAcademicYear?->id;\n        $degree = $request->input('degree');"
          if old in controller:
              controller = controller.replace(old, new, 1)
          elif "$activeAcademicYear = AcademicYear::where('status', 'active')->latest()->first();" not in controller:
              raise SystemExit('Graduates year filter block not found.')
          controller_path.write_text(controller, encoding='utf-8')
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resources/views/public/yearbook/graduates.blade.php app/Http/Controllers/PublicYearbookController.php
          git diff --cached --quiet && exit 0
          git commit -m "Calm graduates directory"
          git push