name: Fix public graduation route and add view modes

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch public pages
        run: |
          python - <<'PY'
          from pathlib import Path

          # Graduation routes must come before the catch-all academic-year route.
          p = Path('routes/web.php')
          s = p.read_text(encoding='utf-8')
          old = "  Route::get('/{academicYear}/pdf', [YearbookPdfController::class, 'book'])->name('book.pdf');\n  Route::get('/{academicYear}', [PublicYearbookController::class, 'book'])->name('book');\n  Route::get('/graduations/{id}', [PublicYearbookController::class, 'graduationDetail'])->name('graduation.detail');\n  Route::get('/graduations', [PublicYearbookController::class, 'graduations'])->name('graduations');"
          new = "  Route::get('/graduations/{id}', [PublicYearbookController::class, 'graduationDetail'])->name('graduation.detail');\n  Route::get('/graduations', [PublicYearbookController::class, 'graduations'])->name('graduations');\n  Route::get('/{academicYear}/pdf', [YearbookPdfController::class, 'book'])->name('book.pdf');\n  Route::get('/{academicYear}', [PublicYearbookController::class, 'book'])->name('book');"
          if old in s:
              p.write_text(s.replace(old, new, 1), encoding='utf-8')

          def patch_view(path, marker, css, js):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              if marker not in s:
                  end = s.find('</style>')
                  if end == -1:
                      raise SystemExit(f'No style block found in {path}')
                  s = s[:end] + css + '\n' + s[end:]
              if js.strip() not in s:
                  pos = s.rfind('@endsection')
                  if pos == -1:
                      raise SystemExit(f'No final @endsection found in {path}')
                  s = s[:pos] + js + '\n\n' + s[pos:]
              p.write_text(s, encoding='utf-8')

          events_css = '''
    .public-view-modes { display:flex; align-items:center; gap:4px; padding:4px; border:1px solid var(--events-line); border-radius:12px; background:#fff; box-shadow:0 6px 22px rgba(0,42,92,.05); margin:0 0 18px auto; width:max-content; }
    .public-view-mode { border:0; border-radius:8px; padding:9px 14px; background:transparent; color:var(--events-muted); font-size:.68rem; font-weight:800; letter-spacing:.6px; text-transform:uppercase; cursor:pointer; transition:all .3s ease; }
    .public-view-mode:hover { background:var(--events-paper); color:var(--events-dark); }
    .public-view-mode.is-active { background:var(--events-dark); color:#fff; }
    .events-list.view-large { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px; border-top:0; }
    .events-list.view-large .event-list-link { height:100%; }
    .events-list.view-large .event-list-item { height:100%; min-height:260px; grid-template-columns:minmax(0,1fr) 34px; grid-template-rows:auto 1fr; align-items:start; gap:18px; padding:28px; border:1px solid var(--events-line); border-radius:18px; background:#fff; box-shadow:0 10px 35px rgba(0,42,92,.045); }
    .events-list.view-large .event-list-date { grid-column:1/-1; }
    .events-list.view-large .event-list-main { grid-column:1; }
    .events-list.view-large .event-list-arrow { grid-column:2; grid-row:2; }
    .events-list.view-large .event-list-link:hover .event-list-item { padding:28px; transform:translateY(-5px); background:#fff; box-shadow:0 20px 45px rgba(0,42,92,.10); }
    @media (max-width:760px) { .events-list.view-large { grid-template-columns:1fr; } }
'''
          events_js = '''
<script>
document.addEventListener('DOMContentLoaded', function () {
    const list = document.querySelector('.events-list');
    if (!list || document.querySelector('.events-page .public-view-modes')) return;
    const wrap = document.createElement('div');
    wrap.className = 'public-view-modes';
    wrap.setAttribute('aria-label', 'Event display');
    wrap.innerHTML = '<button type="button" class="public-view-mode is-active" data-view="list">List</button><button type="button" class="public-view-mode" data-view="large">Large</button>';
    list.parentElement.insertBefore(wrap, list);
    const buttons = wrap.querySelectorAll('.public-view-mode');
    const apply = mode => { list.classList.toggle('view-large', mode === 'large'); buttons.forEach(b => b.classList.toggle('is-active', b.dataset.view === mode)); localStorage.setItem('yearbook-events-view', mode); };
    buttons.forEach(b => b.addEventListener('click', () => apply(b.dataset.view)));
    apply(localStorage.getItem('yearbook-events-view') === 'large' ? 'large' : 'list');
});
</script>
'''
          patch_view('resources/views/public/yearbook/events.blade.php', 'public-view-modes', events_css, events_js)

          graduates_css = '''
    .graduates-page .public-view-modes { display:flex; align-items:center; gap:4px; padding:4px; border:1px solid var(--g-line); border-radius:12px; background:#fff; box-shadow:0 6px 22px rgba(0,42,92,.05); margin:0 0 18px auto; width:max-content; }
    .graduates-page .public-view-mode { border:0; border-radius:8px; padding:9px 14px; background:transparent; color:var(--g-muted); font-size:.68rem; font-weight:800; letter-spacing:.6px; text-transform:uppercase; cursor:pointer; transition:all .3s ease; }
    .graduates-page .public-view-mode:hover { background:#f3f6f9; color:var(--g-ink); }
    .graduates-page .public-view-mode.is-active { background:var(--g-ink); color:#fff; }
    .graduates-page .graduates-grid.view-list { display:flex; flex-direction:column; gap:0; }
    .graduates-page .graduates-grid.view-list .graduate-card { display:grid; grid-template-columns:112px minmax(0,1fr) auto; align-items:center; gap:22px; min-height:128px; padding:18px 20px; border-bottom:1px solid var(--g-line); border-radius:0; box-shadow:none; background:transparent; }
    .graduates-page .graduates-grid.view-list .graduate-card:first-child { border-top:1px solid var(--g-line); }
    .graduates-page .graduates-grid.view-list .graduate-card:hover { transform:none; background:#fff; box-shadow:0 10px 28px rgba(0,42,92,.06); }
    .graduates-page .graduates-grid.view-list .graduate-card-image { width:112px; height:92px; border-radius:12px; }
    @media (max-width:700px) { .graduates-page .graduates-grid.view-list .graduate-card { grid-template-columns:82px minmax(0,1fr); } .graduates-page .graduates-grid.view-list .graduate-card-image { width:82px; height:82px; } .graduates-page .graduates-grid.view-list .graduate-card-action { display:none; } }
'''
          graduates_js = '''
<script>
document.addEventListener('DOMContentLoaded', function () {
    const grid = document.querySelector('.graduates-grid');
    if (!grid || document.querySelector('.graduates-page .public-view-modes')) return;
    const wrap = document.createElement('div');
    wrap.className = 'public-view-modes';
    wrap.setAttribute('aria-label', 'Graduate display');
    wrap.innerHTML = '<button type="button" class="public-view-mode is-active" data-view="cards">Cards</button><button type="button" class="public-view-mode" data-view="list">List</button>';
    grid.parentElement.insertBefore(wrap, grid);
    const buttons = wrap.querySelectorAll('.public-view-mode');
    const apply = mode => { grid.classList.toggle('view-list', mode === 'list'); buttons.forEach(b => b.classList.toggle('is-active', b.dataset.view === mode)); localStorage.setItem('yearbook-graduates-view', mode); };
    buttons.forEach(b => b.addEventListener('click', () => apply(b.dataset.view)));
    apply(localStorage.getItem('yearbook-graduates-view') === 'list' ? 'list' : 'cards');
});
</script>
'''
          patch_view('resources/views/public/yearbook/graduates.blade.php', 'GRADUATE VIEW MODE SWITCHER', graduates_css, graduates_js)
          PY

      - name: Commit patched pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add routes/web.php resources/views/public/yearbook/events.blade.php resources/views/public/yearbook/graduates.blade.php
          git diff --cached --quiet && exit 0
          git commit -m "Fix graduation route and add list and large view modes"
          git push
