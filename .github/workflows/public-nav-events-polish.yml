name: Polish public navigation and events

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update public pages
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          layout = Path('resources/views/public/layout.blade.php')
          text = layout.read_text(encoding='utf-8')
          old_nav = '''                    <a href="{{ route('public.events') }}" class="nav-item {{ request()->routeIs('public.events') ? 'is-active' : '' }}">Events</a>\n                    <a href="{{ route('public.graduates') }}" class="nav-item {{ request()->routeIs('public.graduates') ? 'is-active' : '' }}">Graduates</a>'''
          new_nav = '''                    <a href="{{ route('public.events') }}" class="nav-item {{ request()->routeIs('public.events') ? 'is-active' : '' }}">Events</a>\n                    <a href="{{ route('public.graduations') }}" class="nav-item {{ request()->routeIs('public.graduations') ? 'is-active' : '' }}">Graduations</a>\n                    <a href="{{ route('public.graduates') }}" class="nav-item {{ request()->routeIs('public.graduates') ? 'is-active' : '' }}">Graduates</a>'''
          if old_nav in text and "route('public.graduations')" not in text[text.find('<div class="nav-links'):text.find('</div>', text.find('<div class="nav-links'))]:
              text = text.replace(old_nav, new_nav, 1)
          layout.write_text(text, encoding='utf-8')

          events_path = Path('resources/views/public/yearbook/events.blade.php')
          events = events_path.read_text(encoding='utf-8')

          marker = '''                        {{-- MAIN CONTENT --}}\n\n                        <div class="event-list-main">'''
          replacement = '''                        {{-- EVENT MEDIA --}}\n                        @php($eventMedia = $event->media->first())\n                        <div class="event-list-media" aria-hidden="true">\n                            @if($eventMedia && $eventMedia->type === 'image')\n                                <img src="{{ $eventMedia->thumbnailUrl() }}" alt="" loading="lazy">\n                            @elseif($eventMedia)\n                                <span class="event-media-mark">▶</span>\n                            @else\n                                <span class="event-media-mark">✦</span>\n                            @endif\n                            <span class="event-media-index">{{ str_pad($loop->iteration, 2, '0', STR_PAD_LEFT) }}</span>\n                        </div>\n\n                        {{-- MAIN CONTENT --}}\n\n                        <div class="event-list-main">'''
          if marker in events and 'event-list-media' not in events:
              events = events.replace(marker, replacement, 1)

          creative_css = r'''
    /* =========================================================
       EDITORIAL EVENT JOURNAL
       ========================================================= */
    .events-page {
        --events-accent: #c99b45;
        --events-dark: #082b50;
        --events-muted: #718096;
        --events-line: #e3e9ef;
        --events-paper: #f7f9fb;
    }

    .events-hero {
        min-height: 410px;
        display: flex;
        align-items: flex-end;
        padding: 82px 0 70px;
        background:
            radial-gradient(circle at 88% 18%, rgba(201,155,69,.13), transparent 25%),
            linear-gradient(135deg, #f7fafc 0%, #fff 58%, #eef4f8 100%);
    }

    .events-hero::after {
        content: 'MEMORIES';
        position: absolute;
        right: -20px;
        bottom: -42px;
        color: rgba(8,43,80,.035);
        font-size: clamp(5rem, 14vw, 12rem);
        line-height: 1;
        font-weight: 900;
        letter-spacing: -.08em;
        pointer-events: none;
    }

    .events-hero h1 {
        color: var(--events-dark);
        letter-spacing: -3.5px;
    }

    .events-kicker { color: var(--events-accent); }

    .events-discovery { margin-top: -22px; }

    .events-filter-shell {
        border-radius: 18px;
        border-color: rgba(8,43,80,.08);
        box-shadow: 0 16px 42px rgba(15,23,42,.055);
    }

    .events-list {
        position: relative;
        border-top: 1px solid var(--events-dark);
    }

    .events-list::before {
        content: '';
        position: absolute;
        left: 116px;
        top: 0;
        bottom: 0;
        width: 1px;
        background: #edf1f4;
        pointer-events: none;
    }

    .event-list-item {
        position: relative;
        grid-template-columns: 104px 150px minmax(0,1fr) 34px;
        gap: 24px;
        min-height: 170px;
        padding: 24px 8px;
        background: #fff;
    }

    .event-list-link:nth-child(odd) .event-list-item { background: #fbfcfd; }

    .event-list-link:hover .event-list-item {
        padding-left: 14px;
        padding-right: 2px;
        background: #f5f8fa;
        transform: translateX(3px);
    }

    .event-list-date {
        align-self: stretch;
        display: flex;
        align-items: center;
        color: var(--events-dark);
        font-size: .67rem;
        letter-spacing: 1px;
        text-align: right;
        justify-content: flex-end;
    }

    .event-list-date::first-line { color: var(--events-accent); }

    .event-list-media {
        position: relative;
        height: 122px;
        overflow: hidden;
        border-radius: 12px;
        background: linear-gradient(145deg, #12395e, #456f92);
        box-shadow: 0 7px 18px rgba(8,43,80,.08);
    }

    .event-list-media img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform .65s cubic-bezier(.16,1,.3,1);
    }

    .event-list-link:hover .event-list-media img { transform: scale(1.06); }

    .event-media-mark {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        color: rgba(255,255,255,.88);
        font-size: 1.8rem;
        background: linear-gradient(145deg, rgba(8,43,80,.35), rgba(8,43,80,.08));
    }

    .event-media-index {
        position: absolute;
        right: 9px;
        bottom: 8px;
        padding: 4px 6px;
        border-radius: 6px;
        background: rgba(255,255,255,.9);
        color: var(--events-dark);
        font-size: .57rem;
        font-weight: 900;
    }

    .event-list-title {
        font-family: 'Merriweather', serif;
        color: var(--events-dark);
        transition: color .3s ease, transform .45s cubic-bezier(.16,1,.3,1);
    }

    .event-list-link:hover .event-list-title { color: var(--events-accent); }

    .event-category {
        border-color: rgba(201,155,69,.25);
        background: rgba(201,155,69,.07);
        color: #a77b31;
    }

    .event-list-arrow {
        border-radius: 50%;
        align-self: center;
    }

    .events-section-label { color: var(--events-accent); }

    @media (max-width: 800px) {
        .events-list::before { display: none; }
        .event-list-item { grid-template-columns: 92px 120px minmax(0,1fr) 30px; gap: 16px; }
    }

    @media (max-width: 560px) {
        .events-hero { min-height: 350px; padding: 58px 0 50px; }
        .event-list-item { grid-template-columns: 92px minmax(0,1fr) 30px; }
        .event-list-media { grid-column: 1 / -1; grid-row: 1; width: 100%; height: 180px; }
        .event-list-date { grid-column: 1 / 2; grid-row: 2; justify-content: flex-start; text-align: left; align-self: start; }
        .event-list-main { grid-column: 2 / 3; grid-row: 2; }
        .event-list-arrow { grid-column: 3; grid-row: 2; }
    }

    @media (prefers-reduced-motion: reduce) {
        .event-list-media img { transition: none; }
    }
'''

          if 'EDITORIAL EVENT JOURNAL' not in events:
              events = events.replace('</style>', creative_css + '\n</style>', 1)
          events_path.write_text(events, encoding='utf-8')
          PY

      - name: Commit polished public UI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resources/views/public/layout.blade.php resources/views/public/yearbook/events.blade.php
          git diff --cached --quiet && exit 0
          git commit -m "Add graduations tab and polish public events"
          git push