name: Repair public event template
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair Blade variables
        run: |
          sed -i 's/@php( = ->media->first())/@php($eventMedia = $event->media->first())/' resources/views/public/yearbook/events.blade.php
          sed -i 's/@if( && ->type === '\''image'\'')/@if($eventMedia \&\& $eventMedia->type === '\''image'\'')/' resources/views/public/yearbook/events.blade.php
          sed -i 's/{{ ->thumbnailUrl() }}/{{ $eventMedia->thumbnailUrl() }}/' resources/views/public/yearbook/events.blade.php
          sed -i 's/@elseif()/@elseif($eventMedia)/' resources/views/public/yearbook/events.blade.php
          sed -i 's/{{ str_pad(->iteration, 2, '\''0'\'', STR_PAD_LEFT) }}/{{ str_pad($loop->iteration, 2, '\''0'\'', STR_PAD_LEFT) }}/' resources/views/public/yearbook/events.blade.php
      - name: Commit repaired template
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resources/views/public/yearbook/events.blade.php
          git diff --cached --quiet || git commit -m "Repair public event template"
          git push || true