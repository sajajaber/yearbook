name: Fix public graduates academic-year grouping

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix-public-graduates:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Update graduates academic-year grouping
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("resources/views/public/yearbook/graduates.blade.php")
          text = path.read_text(encoding="utf-8")

          pattern = re.compile(
              r"/\*\s*\n\s*\* Keep every graduate equal\.\s*\n\s*\*\s*\n\s*\* Graduates are grouped by ceremony year\s*\n\s*\* when that information exists\.\s*\n\s*\*/\s*\n\s*\$groupedGraduates = \$graduates\s*\n\s*->getCollection\(\)\s*\n\s*->groupBy\(function \(\$graduate\) \{.*?\n\s*\}\);",
              re.DOTALL,
          )

          replacement = """/*
          * Keep every graduate equal.
          *
          * Graduates belong to an academic year directly.
          * Ceremony attendance is optional, so ceremony dates
          * must not determine the yearbook grouping.
          */

          $groupedGraduates = $graduates
          ->getCollection()
          ->groupBy(function ($graduate) {

          return $graduate->academicYear?->title
              ?? 'Academic Year';

          });"""

          updated, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit("Expected ceremony-year grouping block was not found; no file was changed.")

          path.write_text(updated, encoding="utf-8")
          print("Updated public graduates grouping.")
          PY

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resources/views/public/yearbook/graduates.blade.php
          git rm .github/workflows/fix-public-graduates-academic-year.yml
          git commit -m "Group public graduates by academic year"
          git push
